# Streamlit theme: controls in ink, never the default red. Colour is kept for
# status (the DRAFT and FINAL chips) and materiality only; lib/theme.py holds
# the palette, and test_web checks this value matches its INK.
[theme]
primaryColor = "#1E2A2E"

# Visitors see the app, not the developer menu or the Deploy button.
[client]
toolbarMode = "minimal"

# The upload limit the pages state (1 MB a file), enforced by the server too;
# lib/inputs.py checks it again with a plain message.
[server]
maxUploadSize = 1

[browser]
gatherUsageStats = false

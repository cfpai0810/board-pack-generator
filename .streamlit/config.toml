# Streamlit theme: controls in the series navy, never the default red. Colour
# is kept for status (the DRAFT and FINAL chips) and materiality only;
# lib/theme.py holds the palette, and test_web checks this value matches its
# ACCENT.
[theme]
primaryColor = "#1A3A5C"

# Visitors see the app, not the developer menu or the Deploy button.
[client]
toolbarMode = "minimal"

# The upload limit the pages state (1 MB a file), enforced by the server too;
# lib/inputs.py checks it again with a plain message.
[server]
maxUploadSize = 1

[browser]
gatherUsageStats = false
